<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loamkeep</title>
    <style>
      /* No elastic overscroll bounce on any scroller, ever. The horizontal
         axis is left alone: that one is the browser's back gesture. */
      * {
        overscroll-behavior-y: none;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a14;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        color: #cbdbfc;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app canvas {
        image-rendering: pixelated;
        display: block;
        cursor: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
